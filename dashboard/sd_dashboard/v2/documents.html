<!doctype html>
<!--
  Documents (sd:2114), at /documents. Built from the design source's products/system/designs/v2/documents.html, documents.js and
  documents.css at 7f50ad4, with design.md and commands.md.
  Data: /api/documents (documents_screen.document: every root documents.conf and the docs/dashboard scan give, every file
  /documents/<key>/<file> serves, with its title, h1 and stand line, its derived kind and its render state), read when the page opens.
  Pin, Hide and Tag write the workflow database's view state through POST /api/documents/view (sd:3428), and so do Rename
  root and Hide root (sd:3986). Nothing here is sample data.
  Books (sd:6260) and Videos (sd:6261) are views beside the list: /api/documents/books and /api/documents/videos
  (learning_screen: the vault's learning rows whose content-type is book, article or course, or youtube or video, or whose title
  is "YYYY-MM-DD - YouTube - <channel> - <title>"), each read when its view first shows, drawn by learning.js into the
  one Details pane. The search field above filters the shown view; the facets are the Documents list's and hide while
  another view shows.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Documents · system</title>
<link rel="stylesheet" href="/ui/fonts.css">
<link rel="stylesheet" href="/ui/tokens.css">
<script src="/ui/theme.js"></script>
<script src="/ui/markup.js"></script>
<link rel="stylesheet" href="/ui/shell.css">
<link rel="stylesheet" href="/ui/documents.css">
</head>
<body data-page="Documents" data-scope="documents">
<script src="/ui/icons.js"></script>
<div class="shell">
  <main id="main">
    <header class="head">
      <div>
        <h1>Documents</h1>
        <p id="subhead">Reading the document roots…</p>
      </div>
    </header>
    <div id="state" hidden></div>
    <!-- The toolbar standard (sd:5281): row 1, the views then the page's filter; the count sits on the table's title line. -->
    <div class="toolbar" id="toolbar">
      <div class="shift">
        <label class="field">
          <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
          <span class="sr">Search, filter or request a document</span>
          <input id="shift" placeholder="Search, repo:&lt;key&gt; kind:research stale, or request …" autocomplete="off" aria-describedby="shift-hint">
          <span class="ghost" id="ghost"></span>
          <kbd>/</kbd>
        </label>
        <div class="preview" id="shift-preview" hidden>
          <p class="as"><span class="label">As</span><span id="shift-as"></span></p>
          <div class="chips" id="shift-chips" role="group" aria-label="Parsed"></div>
          <div class="chips" role="group" aria-label="Interpret as" id="shift-modes">
            <button class="chip" type="button" data-as="search" aria-pressed="true">search and filter</button>
            <button class="chip" type="button" data-as="request" aria-pressed="false">request a document</button>
          </div>
          <div class="req" id="req" hidden></div>
          <p class="hint" id="shift-hint">→ switches reading · Enter commits · Esc clears · Tab moves on</p>
        </div>
      </div>
    </div>

    <section aria-label="Facets" class="facets toolbar-2" id="facets"></section>

    <section id="view-documents" aria-labelledby="list-h">
      <div class="sec-head">
        <h2 id="list-h">Documents <button class="help" type="button" aria-label="Help: Documents" data-help="<b>Found, not listed by hand.</b> Every repo with a docs/dashboard folder counts; documents.conf only renames, skips or adds one. Render-stale: the source changed after the page was built.">
          <svg class="i" aria-hidden="true"><use href="#i-circle-help"/></svg></button></h2>
        <p class="tally" id="tally"></p>
      </div>
      <div id="chips" aria-live="polite"></div>
      <table class="ledger" aria-labelledby="list-h" data-tfilter="page" data-toolbar="toolbar">
        <thead id="rows-head"></thead>
        <tbody id="rows"></tbody>
      </table>
      <p class="empty" id="empty" hidden></p>
      <div id="pager"></div>
      <div id="list-help"></div>
    </section>

    <section id="view-books" aria-labelledby="books-h">
      <div id="state-books" hidden></div>
      <div class="sec-head">
        <h2 id="books-h">Books and courses <button class="help" type="button" aria-label="Help: Books and courses" data-help="<b>The vault's Learning base.</b> Each row is a learning note whose content-type is book, article or course; the Kind tiles narrow to one. Its read state is the row's stage: to read, reading, done or dropped. Open item moves it in Tasks; Add files a new row.">
          <svg class="i" aria-hidden="true"><use href="#i-circle-help"/></svg></button></h2>
        <p class="tally" id="books-tally"></p>
        <div class="tools"><button class="btn quiet" type="button" data-cmd="book.add" data-obj="books">Add book…</button></div>
      </div>
      <div class="filters toolbar-2" id="books-filters"></div>
      <table class="ledger" aria-labelledby="books-h" data-tfilter="page" data-toolbar="toolbar">
        <thead id="books-head"></thead>
        <tbody id="books-rows"></tbody>
      </table>
      <p class="empty" id="books-empty" hidden></p>
      <div id="books-pager"></div>
      <div id="books-help"></div>
    </section>
    <section id="view-videos" aria-labelledby="videos-h">
      <div id="state-videos" hidden></div>
      <div class="sec-head">
        <h2 id="videos-h">Videos <button class="help" type="button" aria-label="Help: Videos" data-help="<b>The vault's Learning base.</b> Each row is a learning note whose content-type is youtube or video, or whose title reads YYYY-MM-DD - YouTube - channel - title. Its watched state is the row's stage: to watch, watching, watched or dropped. Open item moves it in Tasks; Add files a new row.">
          <svg class="i" aria-hidden="true"><use href="#i-circle-help"/></svg></button></h2>
        <p class="tally" id="videos-tally"></p>
        <div class="tools"><button class="btn quiet" type="button" data-cmd="video.add" data-obj="videos">Add video…</button></div>
      </div>
      <div class="filters toolbar-2" id="videos-filters"></div>
      <table class="ledger" aria-labelledby="videos-h" data-tfilter="page" data-toolbar="toolbar">
        <thead id="videos-head"></thead>
        <tbody id="videos-rows"></tbody>
      </table>
      <p class="empty" id="videos-empty" hidden></p>
      <div id="videos-pager"></div>
      <div id="videos-help"></div>
    </section>
  </main>

  <div class="details" id="details"><p class="why">Select a document to see its facts and what can be done with it.</p></div>
</div>
<script src="/ui/sections.js"></script>
<script src="/ui/read.js"></script>
<script src="/ui/commands.js"></script>
<script src="/ui/documents.js"></script>
<script src="/ui/learning.js"></script>
<script src="/ui/shell.js"></script>
</body>
</html>
