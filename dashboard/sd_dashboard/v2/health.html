<!doctype html>
<!--
  Health (sd:2115), at /fleet-health: /health is the service's own check (runtime.py reads it). Built from the design source's
  products/system/designs/v2/health.{html,css,js} at d82daa1, with design.md and commands.md.
  Data: /api/health/summary (every lamp and the badge, waiting on no walker) and /api/health/<view> (one view's areas,
  health_screen.part: Checkouts, Machine, GitHub, Jobs, Status), each read the first time its view opens and on Refresh. Every fix is a CLI line for Copy. The two writes are
  Re-run collector: POST /api/shadow/sync starts the server's shadow sync, as Contributions' does (sd:2894), and
  Snooze (sd:1896): /ui/snooze.js; a row's Snooze or Unsnooze posts /api/snooze, and Health reads again; Ignore and
  Unignore (sd:5470) post the same route with no end.
  Nothing here is sample data.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Health · system</title>
<link rel="stylesheet" href="/ui/fonts.css">
<link rel="stylesheet" href="/ui/tokens.css">
<script src="/ui/theme.js"></script>
<script src="/ui/markup.js"></script>
<script src="/ui/annunciator-strip.js"></script>
<link rel="stylesheet" href="/ui/shell.css">
<link rel="stylesheet" href="/ui/annunciator-strip.css">
<link rel="stylesheet" href="/ui/health.css">
</head>
<body data-page="Health" data-scope="fleet">
<script src="/ui/icons.js"></script>
<div class="shell">
  <main>
    <header class="head">
      <div>
        <h1>Health</h1>
        <p id="subhead">Reading the fleet…</p>
      </div>
    </header>

    <div id="state" hidden></div>
    <h2 class="sr">Areas</h2>
    <annunciator-strip><ul class="annunciator" id="annunciator"></ul></annunciator-strip>
    <!-- The toolbar standard (sd:5281): row 1, the shell's Shapeshift bar (sd:5539); the views and their counts sit in the rail (pack sd:7084). -->
    <div class="toolbar" id="toolbar" data-shift></div>
    <section id="view-checkouts" aria-label="Checkouts"><div id="state-checkouts" hidden></div><div id="body-checkouts"></div></section>
    <section id="view-machine" aria-label="Machine" hidden><div id="state-machine" hidden></div><div id="body-machine"></div></section>
    <section id="view-github" aria-label="GitHub" hidden><div id="state-github" hidden></div><div id="body-github"></div></section>
    <section id="view-jobs" aria-label="Jobs" hidden><div id="state-jobs" hidden></div><div id="body-jobs"></div></section>
    <section id="view-status" aria-label="Status" hidden><div id="state-status" hidden></div><div id="body-status"></div></section>
    <div id="snoozed"></div>
  </main>
  <div class="details" id="details"><p class="why">Reading the fleet…</p></div>
</div>
<script src="/ui/sections.js"></script>
<script src="/ui/read.js"></script>
<script src="/ui/snooze.js"></script>
<script src="/ui/commands.js"></script>
<script src="/ui/health.js"></script>
<script src="/ui/shell.js"></script>
</body>
</html>
