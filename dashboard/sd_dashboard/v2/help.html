<!doctype html>
<!--

  run's budget from its reference file, and the sections of v2/help.md with each live value read now from its source.

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <header class="head">
      <div>
        <h1>Help</h1>

      </div>

    <div id="state" hidden></div>
    <p class="why" id="problems" hidden></p>
